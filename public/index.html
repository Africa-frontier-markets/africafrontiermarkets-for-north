<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfricaFrontierMarkets — Une plateforme de marchés financiers panafricaine, en construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFAF8;
    --surface:#FFFFFF;
    --tint:#F7EEF0;
    --tint-2:#FBF3EC;
    --deep:#8C5A6B;
    --deep-2:#734A59;
    --ink:#464646;
    --ink-2:#2E2E2E;
    --soft:#8A8480;
    --border:#E8E0DC;
    --rose:#C48A9A;
    --rose-line:#DDB6C0;
    --good:#3F8F6F;
    --good-bg:#E9F5EE;
    --warn:#B08A2E;
    --warn-bg:#FBF3DA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',sans-serif;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Lora',serif;color:var(--ink-2);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}

  /* ---------- Top nav ---------- */
  header.topnav{
    position:sticky;top:0;z-index:50;
    background:rgba(252,250,248,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    max-width:1180px;margin:0 auto;padding:14px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .logo{display:flex;align-items:center;gap:9px;font-family:'Lora',serif;font-weight:600;font-size:18px;color:var(--ink-2);}
  .logo .mark{
    width:30px;height:30px;border-radius:8px;background:var(--deep);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;font-family:'Inter',sans-serif;
  }
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;}
  nav.tabs button{
    all:unset;cursor:pointer;padding:8px 14px;border-radius:20px;
    font-size:13.5px;color:var(--soft);font-weight:500;
  }
  nav.tabs button:hover{background:var(--tint);color:var(--ink-2);}
  nav.tabs button.active{background:var(--deep);color:#fff;}
  @media(max-width:920px){.nav-inner{flex-direction:column;align-items:flex-start;} nav.tabs{width:100%;}}

  .wrap{max-width:1180px;margin:0 auto;padding:48px 28px 80px;}
  .eyebrow{
    display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--rose);border:1px solid var(--rose-line);padding:5px 12px;border-radius:20px;
    margin-bottom:18px;font-weight:600;
  }
  h1.page-title{font-size:38px;font-weight:600;margin:0 0 14px;line-height:1.18;}
  p.lede{font-size:16px;color:var(--soft);max-width:760px;margin:0 0 34px;}
  h2.section-title{font-size:26px;font-weight:600;margin:0 0 8px;}
  p.section-sub{color:var(--soft);font-size:14.5px;max-width:700px;margin:0 0 26px;}

  .grid{display:grid;gap:18px;}
  .grid.c2{grid-template-columns:1fr 1fr;}
  .grid.c3{grid-template-columns:repeat(3,1fr);}
  .grid.c4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:900px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px 26px;
  }
  .card.tint{background:var(--tint);border-color:var(--rose-line);}
  .card.deep{background:var(--deep);color:#fff;border:none;}
  .card.deep h3{color:#fff;}
  .card h3{margin:0 0 10px;font-size:16px;}
  .card p{margin:0;color:var(--soft);font-size:14px;}
  .card.deep p{color:#F1DEE3;}

  .badge-row{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0;}
  .chip{
    display:flex;align-items:center;gap:10px;background:var(--tint);
    border:1px solid var(--rose-line);border-radius:12px;padding:14px 18px;flex:1;min-width:220px;
  }
  .chip .ic{font-size:20px;}
  .chip .t{font-weight:600;color:var(--ink-2);font-size:14.5px;}
  .chip .d{font-size:12px;color:var(--soft);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:10px 12px;color:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
  td{padding:11px 12px;border-bottom:1px solid #F0EAE7;}
  tr:last-child td{border-bottom:none;}
  .ok{color:var(--good);font-weight:600;}
  .mid{color:var(--warn);font-weight:600;}
  .no{color:#B85C5C;font-weight:600;}

  .divider{height:1px;background:var(--border);margin:52px 0;}

  /* ---------- API cards ---------- */
  .api-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;margin-bottom:20px;
  }
  .api-head{
    display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--tint);
    border-bottom:1px solid var(--rose-line);flex-wrap:wrap;
  }
  .method{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    padding:4px 10px;border-radius:6px;color:#fff;
  }
  .method.post{background:#8C5A6B;}
  .method.get{background:#3F8F6F;}
  .endpoint{font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--ink-2);}
  .api-name{margin-left:auto;font-weight:600;font-size:14px;color:var(--ink-2);}
  .api-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:800px){.api-body{grid-template-columns:1fr;}}
  .api-body h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);}
  pre.code{
    margin:0;background:#2E2620;color:#F3E9E2;border-radius:10px;padding:14px 16px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;overflow-x:auto;
  }
  .api-meta{grid-column:1 / -1;display:flex;gap:22px;flex-wrap:wrap;padding-top:6px;border-top:1px solid #F0EAE7;margin-top:4px;font-size:12.5px;color:var(--soft);}
  .api-meta strong{color:var(--ink-2);}

  .partner-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;}
  .partner{
    font-size:12.5px;padding:6px 12px;border-radius:20px;background:#fff;
    border:1px solid var(--border);color:var(--ink);
  }

  footer{border-top:1px solid var(--border);padding:36px 28px;text-align:center;color:var(--soft);font-size:12.5px;}
  footer strong{color:var(--ink-2);}

  .roadmap-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid #F0EAE7;}
  .roadmap-item:last-child{border-bottom:none;}
  .roadmap-num{
    width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--tint);
    border:1px solid var(--rose-line);display:flex;align-items:center;justify-content:center;
    font-family:'Lora',serif;font-weight:600;color:var(--deep);font-size:14px;
  }
  .roadmap-num.done{background:var(--good-bg);border-color:var(--good);color:var(--good);}
  .roadmap-item h4{margin:0 0 3px;font-size:14.5px;color:var(--ink-2);}
  .roadmap-item p{margin:0;font-size:13px;color:var(--soft);}

  .callout{
    background:var(--warn-bg);border:1px solid #E3D18C;border-radius:12px;
    padding:14px 18px;font-size:13px;color:#6B551E;display:flex;gap:10px;align-items:flex-start;
  }
</style>
</head>
<body>

<header class="topnav">
  <div class="nav-inner">
    <div class="logo"><span class="mark">AFM</span> AfricaFrontierMarkets</div>
    <nav class="tabs" id="tabs">
      <button data-tab="plateforme" class="active">Plateforme</button>
      <button data-tab="frontierpay">FrontierPay</button>
      <button data-tab="easymarket">EasyMarket</button>
      <button data-tab="fintech">Fintech &amp; PSP</button>
      <button data-tab="levee">Vision &amp; feuille de route</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer>
  <strong>AfricaFrontierMarkets</strong> — Douala, Cameroun · MEL Invests · Document de travail, en construction<br>
  invest@africafrontiermarkets.com
</footer>

<script>
/* =========================================================================
   CONTENU
   ========================================================================= */
const PSP_FRONTIERPAY = ["Visa Direct","Xendit","Payoneer","MTN MoMo","Orange Money","Wave","Tranglo"];
const BROKERS_EASYMARKET = ["Interactive Brokers","Saxo Bank","Inopay (BRVM)"];

const ALL_MARKETS = [
  {code:"BRVM",name:"BRVM",region:"Afrique de l'Ouest",currency:"XOF"},
  {code:"NSE_NG",name:"NSE Nigeria",region:"Afrique de l'Ouest",currency:"NGN"},
  {code:"GSE",name:"Ghana Stock Exchange",region:"Afrique de l'Ouest",currency:"GHS"},
  {code:"BRV_CV",name:"BRV Cap-Vert",region:"Afrique de l'Ouest",currency:"CVE"},
  {code:"NSE_KE",name:"NSE Kenya",region:"Afrique de l'Est",currency:"KES"},
  {code:"DSE",name:"Dar es Salaam SE",region:"Afrique de l'Est",currency:"TZS"},
  {code:"USE",name:"Uganda SE",region:"Afrique de l'Est",currency:"UGX"},
  {code:"RSE",name:"Rwanda SE",region:"Afrique de l'Est",currency:"RWF"},
  {code:"EGX",name:"Egypt Exchange",region:"Afrique du Nord",currency:"EGP"},
  {code:"BSE_MA",name:"Casablanca SE",region:"Afrique du Nord",currency:"MAD"},
  {code:"BVMT",name:"Tunis SE",region:"Afrique du Nord",currency:"TND"},
  {code:"JSE",name:"Johannesburg SE",region:"Afrique australe",currency:"ZAR"},
  {code:"LUSE",name:"Lusaka SE",region:"Afrique australe",currency:"ZMW"},
  {code:"BSE_BW",name:"Botswana SE",region:"Afrique australe",currency:"BWP"},
  {code:"NYSE",name:"New York SE",region:"Amériques",currency:"USD"},
  {code:"NASDAQ",name:"NASDAQ",region:"Amériques",currency:"USD"},
  {code:"LSE",name:"London SE",region:"Europe",currency:"GBP"},
  {code:"EURONEXT",name:"Euronext",region:"Europe",currency:"EUR"},
  {code:"XETRA",name:"Deutsche Börse",region:"Europe",currency:"EUR"},
  {code:"TSE",name:"Tokyo SE",region:"Asie",currency:"JPY"},
  {code:"SSE",name:"Shanghai SE",region:"Asie",currency:"CNY"},
];

function chip(ic,t,d){return `<div class="chip"><span class="ic">${ic}</span><div><div class="t">${t}</div><div class="d">${d}</div></div></div>`;}
function partners(list){return `<div class="partner-grid">${list.map(p=>`<span class="partner">${p}</span>`).join('')}</div>`;}
function marketsTable(){
  const regions = [...new Set(ALL_MARKETS.map(m=>m.region))];
  let rows = '';
  for(const r of regions){
    rows += `<tr style="background:var(--tint);"><td colspan="3" style="font-weight:600;color:var(--deep);font-size:12px;text-transform:uppercase;letter-spacing:.04em;">${r}</td></tr>`;
    for(const m of ALL_MARKETS.filter(x=>x.region===r)){
      rows += `<tr><td>${m.name}</td><td class="mono small">${m.code}</td><td class="mono">${m.currency}</td></tr>`;
    }
  }
  return `<div class="card" style="padding:0;overflow:hidden;">
    <table><thead><tr><th>Marché</th><th>Code</th><th>Devise</th></tr></thead><tbody>${rows}</tbody></table>
  </div>
  <p class="section-sub" style="margin-top:12px;">Couverture de marché visée par la feuille de route d'intégration. Aucune connectivité d'exécution en direct n'est confirmée à ce jour sur ces places — voir l'onglet Fintech &amp; PSP pour le principe de fonctionnement prévu.</p>`;
}

    <div class="card tint"><h3>🤖 AI Advisory — Intelligence</h3><p>Assistant IA intégré pour l'analyse de portefeuille et le conseil personnalisé, en français et en anglais. Module en développement.</p></div>
  </div>

  <div class="divider"></div>

  <span class="eyebrow">Positionnement</span>
  <h2 class="section-title">Une combinaison rare sur le marché</h2>
  <p class="section-sub">Peu d'acteurs, globaux ou locaux, combinent aujourd'hui le trading international, les paiements multi-devises XAF et un conseil assisté par IA dans une seule application pensée pour l'Afrique centrale. C'est l'axe de différenciation que nous construisons — il reste à démontrer à l'usage, pas encore acquis.</p>
  `;
}

/* ---------- EASYMARKET ---------- */

  return `
  <span class="eyebrow">Module 2 · Trading — en développement</span>

/* ---------- FINTECH & PSP (principe de fonctionnement, sans détail partenaire) ---------- */
function renderFintech(){
  return `
  <span class="eyebrow">Architecture technique cible</span>
  <h1 class="page-title">Fintech &amp; PSP — principe de fonctionnement envisagé</h1>

function render(){
  const tab = document.querySelector('#tabs button.active').dataset.tab;
  document.getElementById('main').innerHTML = {
    plateforme: renderPlateforme,
    frontierpay: renderFrontierPay,
    easymarket: renderEasyMarket,
    fintech: renderFintech,
    levee: renderLevee,
  }[tab]();
  window.scrollTo({top:0, behavior:'instant'});
}
document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});
render();
